<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Kindling logo">
  <defs>
    <linearGradient id="kd-flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9d2e"/>
      <stop offset="0.55" stop-color="#ff5a1f"/>
      <stop offset="1" stop-color="#e01f4a"/>
    </linearGradient>
    <linearGradient id="kd-core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2b0"/>
      <stop offset="1" stop-color="#ffb02e"/>
    </linearGradient>
  </defs>
  <!-- crossed kindling sticks -->
  <g stroke="#8a5a2b" stroke-width="9" stroke-linecap="round">
    <line x1="30" y1="118" x2="98" y2="104"/>
    <line x1="30" y1="104" x2="98" y2="118"/>
  </g>
  <!-- outer flame -->
  <path d="M64 14 C 78 40, 96 52, 96 78 C 96 100, 82 112, 64 112 C 46 112, 32 100, 32 80 C 32 62, 44 54, 50 40 C 54 52, 62 52, 60 38 C 60 30, 62 22, 64 14 Z" fill="url(#kd-flame)"/>
  <!-- inner core flame -->
  <path d="M64 52 C 72 64, 78 72, 78 84 C 78 96, 71 104, 63 104 C 54 104, 48 96, 48 86 C 48 74, 58 70, 60 58 C 62 66, 66 64, 64 52 Z" fill="url(#kd-core)"/>
</svg>
